<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Castadero Pachón — El Escorpión</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --az:#0d2d6e;--az2:#1a4aad;--az3:#2563eb;--az-c:#dbeafe;
  --ro:#b91c1c;--ro2:#dc2626;--ro-c:#fee2e2;
  --bg:#f1f5f9;--bg2:#e2e8f0;--white:#fff;--txt:#0f172a;--txt2:#475569;--borde:#cbd5e1;
  --nav-h:60px;--sidebar:240px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ===== LAYOUT ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--az);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:width 0.2s}
.sidebar.collapsed{width:64px}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left 0.2s}
.main.expanded{margin-left:64px}

/* ===== SIDEBAR ===== */
.sb-brand{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:10px;min-height:80px;overflow:hidden}
.sb-logo{width:44px;height:44px;border-radius:50%;background:var(--ro);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.8);flex-shrink:0;overflow:hidden}
.sb-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.sb-titles{overflow:hidden;white-space:nowrap}
.sb-main{font-size:13px;font-weight:700;color:#fff;letter-spacing:.5px;text-transform:uppercase}
.sb-sub{font-size:9px;color:#93c5fd;letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.sb-stats{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;gap:8px;overflow:hidden}
.sb-stat{background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 8px;text-align:center;flex:1;min-width:0}
.sb-stat-n{font-size:18px;font-weight:700;color:#fff;line-height:1}
.sb-stat-l{font-size:8px;color:#93c5fd;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-btn{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;border:none;background:none;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;width:100%;margin-bottom:2px;transition:all 0.15s;white-space:nowrap;overflow:hidden}
.sb-btn i{font-size:20px;flex-shrink:0;color:rgba(255,255,255,0.6)}
.sb-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.sb-btn:hover i{color:#fff}
.sb-btn.active{background:rgba(255,255,255,0.15);color:#fff}
.sb-btn.active i{color:#fff}
.sb-btn.active{border-left:3px solid var(--ro)}
.sb-section{font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;padding:12px 10px 4px;white-space:nowrap;overflow:hidden}
.sb-toggle{margin:12px 8px;padding:8px;border:none;background:rgba(255,255,255,0.1);border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sb-toggle i{font-size:18px}

/* ===== TOPBAR ===== */
.topbar{background:var(--white);border-bottom:1px solid var(--borde);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:600;color:var(--az)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--borde);border-radius:20px;padding:5px 12px 5px 6px;font-size:12px;color:var(--txt2);cursor:pointer}
.user-chip i{font-size:16px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}

/* ===== CONTENT ===== */
.page{padding:24px;max-width:1100px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:gap}
.page-title{font-size:20px;font-weight:600;color:var(--az)}
.page-sub{font-size:13px;color:var(--txt2);margin-top:2px}

/* ===== CARDS ===== */
.card{background:var(--white);border:1px solid var(--borde);border-radius:12px;padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:var(--az);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.card-title i{color:var(--ro);font-size:16px}

/* ===== STATS ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--borde);border-radius:10px;padding:14px 16px}
.stat-n{font-size:28px;font-weight:700;color:var(--az)}
.stat-l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ===== FORM ===== */
.f-label{display:block;font-size:11px;font-weight:600;color:var(--az);margin-bottom:4px;margin-top:12px;text-transform:uppercase;letter-spacing:.3px}
.f-in{width:100%;padding:9px 12px;background:#f8faff;border:1.5px solid var(--borde);border-radius:8px;color:var(--txt);font-size:13px;outline:none;transition:border-color 0.2s;font-family:inherit}
.f-in:focus{border-color:var(--az3);background:var(--white)}
textarea.f-in{resize:vertical;min-height:64px}
.f-in-sm{padding:6px 10px;font-size:12px}
.f-row{display:grid;gap:12px}
.f-row-2{grid-template-columns:1fr 1fr}
.f-row-3{grid-template-columns:1fr 1fr 1fr}
.f-row-4{grid-template-columns:1fr 1fr 1fr 1fr}
.peso-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.peso-sep{font-size:12px;color:var(--txt2);text-align:center;padding-top:12px}

/* ===== BUTTONS ===== */
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all 0.15s;font-family:inherit}
.btn:active{transform:scale(0.97)}
.btn-p{background:var(--az);color:#fff}.btn-p:hover{background:var(--az2)}
.btn-r{background:var(--ro);color:#fff}.btn-r:hover{background:var(--ro2)}
.btn-g{background:#059669;color:#fff}.btn-g:hover{background:#047857}
.btn-o{background:var(--white);border:1.5px solid var(--borde);color:var(--txt)}.btn-o:hover{border-color:var(--az);color:var(--az)}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:6px}
.btn-xs{padding:4px 9px;font-size:10px;border-radius:5px}
.btn-full{width:100%}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-danger{background:#fff;border:1.5px solid #fca5a5;color:var(--ro)}.btn-danger:hover{background:var(--ro-c)}

/* ===== GALLO LIST ===== */
.gallo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gallo-card{background:var(--white);border:1.5px solid var(--borde);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column}
.gallo-card:hover{border-color:var(--az3);box-shadow:0 2px 8px rgba(37,99,235,0.1)}
.gallo-photo{height:200px;background:#0f172a;display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden;position:relative}
.gallo-photo img{width:100%;height:100%;object-fit:contain}
.gallo-photo-badge{position:absolute;top:8px;right:8px}
.gallo-body{padding:12px 14px}
.gallo-name{font-size:16px;font-weight:700;color:var(--txt)}
.gallo-placa{font-size:11px;color:var(--az3);font-weight:600;margin:2px 0}
.gallo-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.t-az{background:var(--az-c);color:#1e40af;border:1px solid #93c5fd}
.t-ro{background:var(--ro-c);color:#991b1b;border:1px solid #fca5a5}
.t-lu{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}
.t-gr{background:var(--bg);color:var(--txt2);border:1px solid var(--borde)}
.t-ve{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-am{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}

/* ===== BADGES ===== */
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px}
.b-act{background:#dcfce7;color:#166534;border:1px solid #86efac}
.b-ret{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.b-fal{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.b-cui{background:var(--az-c);color:#1e40af;border:1px solid #93c5fd}
.b-plu{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}
.b-cas{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.b-win{background:#dcfce7;color:#166534;border:1px solid #86efac}
.b-lose{background:var(--ro-c);color:#991b1b;border:1px solid #fca5a5}
.b-draw{background:#fef9c3;color:#854d0e;border:1px solid #fde047}

/* ===== DETAIL ===== */
.detail-layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.detail-photo{width:100%;height:340px;background:#0f172a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden;border:2px solid var(--az3);position:relative}
.detail-photo img{width:100%;height:100%;object-fit:contain}
.irow{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bg);font-size:13px;gap:8px}
.irow:last-child{border-bottom:none}
.ilbl{color:var(--txt2);display:flex;align-items:center;gap:5px;flex-shrink:0}
.ival{color:var(--txt);font-weight:500;text-align:right}

/* ===== LUNA GRID ===== */
.luna-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.luna-opt{padding:8px 4px;border:1.5px solid var(--borde);border-radius:8px;text-align:center;cursor:pointer;background:#f8faff;transition:all 0.2s}
.luna-opt:hover{border-color:#93c5fd}
.luna-opt.sel{border-color:#7c3aed;background:#ede9fe}
.luna-emoji{font-size:20px;display:block}
.luna-lbl{font-size:9px;color:var(--txt2);display:block;margin-top:2px;font-weight:600}
.luna-auto-badge{display:inline-flex;align-items:center;gap:4px;background:#ede9fe;border:1px solid #c4b5fd;color:#5b21b6;padding:3px 8px;border-radius:20px;font-size:11px;margin-top:6px}

/* ===== PHOTO UPLOAD ===== */
.photo-box{border-radius:12px;overflow:hidden;border:2px dashed #93c5fd;background:#f0f7ff;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;transition:border-color 0.2s}
.photo-box:hover{border-color:var(--az3)}
.photo-box.hp{border-style:solid;border-color:var(--az3);background:#000}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.photo-box i{font-size:36px;color:#93c5fd}
.photo-box span{font-size:12px;color:var(--txt2)}
.pov{position:absolute;bottom:0;left:0;right:0;background:rgba(13,45,110,0.85);padding:8px;display:flex;gap:6px;justify-content:center}
.pov button{padding:5px 14px;font-size:11px;border-radius:6px;border:none;cursor:pointer;font-weight:700}
.pc{background:var(--az3);color:#fff}.pg{background:var(--ro);color:#fff}

/* ===== GENEALOGY ===== */
.ped-level{margin-bottom:14px}
.ped-level-title{font-size:10px;font-weight:700;color:var(--txt2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--bg2)}
.ped-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ped-node{border-radius:8px;padding:10px 12px;border:1.5px solid}
.ped-node input{width:100%;margin-top:4px;padding:5px 8px;font-size:11px;border:1px solid var(--borde);border-radius:5px;background:var(--white);color:var(--txt);outline:none;font-family:inherit}
.ped-node input:focus{border-color:var(--az3)}
.ped-role{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.add-level-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#f8faff;border:1.5px dashed var(--borde);border-radius:8px;color:var(--az3);font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;transition:all 0.2s}
.add-level-btn:hover{border-color:var(--az3);background:var(--az-c)}
.remove-level-btn{font-size:10px;color:var(--ro);background:none;border:none;cursor:pointer;margin-left:auto}

/* ===== TOPAS ===== */
.topa-item{background:var(--bg);border:1.5px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.topa-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topa-num{background:var(--az);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.remove-topa{background:none;border:none;color:var(--txt2);cursor:pointer;font-size:14px;padding:2px}
.remove-topa:hover{color:var(--ro)}

/* ===== COMBATE LIST ===== */
.combate-table{width:100%;border-collapse:collapse}
.combate-table th{text-align:left;font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--borde)}
.combate-table td{padding:10px 12px;border-bottom:1px solid var(--bg);font-size:13px;vertical-align:middle}
.combate-table tr:hover td{background:#f8faff}
.combate-table tr{cursor:pointer}

/* ===== CALENDAR ===== */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-title{font-size:18px;font-weight:600;color:var(--az)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dn{text-align:center;font-size:10px;color:var(--txt2);padding:4px 0;font-weight:700;text-transform:uppercase}
.cal-day{text-align:center;font-size:12px;padding:6px 3px;border-radius:7px;position:relative;color:var(--txt);min-height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default}
.cal-day.hg{background:var(--az-c);border:1px solid #93c5fd;color:#1e40af;cursor:pointer;font-weight:700}
.cal-day.hc{background:var(--ro-c);border:1px solid #fca5a5;color:#991b1b;cursor:pointer;font-weight:700}
.cal-day.today{background:var(--ro);color:#fff;font-weight:700}
.cal-ldot{font-size:8px;line-height:1}

/* ===== CONFIG ===== */
.cfg-logo-box{width:100px;height:100px;border-radius:50%;border:3px dashed #93c5fd;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#f0f7ff;margin:0 auto 10px;position:relative;overflow:hidden;font-size:11px;color:var(--txt2);gap:4px}
.cfg-logo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.cfg-logo-box i{font-size:28px;color:#93c5fd}

/* ===== LOGIN ===== */
.login-page{min-height:100vh;background:var(--az);display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--white);border-radius:18px;padding:32px;width:100%;max-width:400px}
.login-logo{width:80px;height:80px;border-radius:50%;background:var(--ro);display:flex;align-items:center;justify-content:center;font-size:38px;border:3px solid #fff;margin:0 auto 14px;overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.login-title{text-align:center;font-size:20px;font-weight:700;color:var(--az);text-transform:uppercase;letter-spacing:1px}
.login-sub{text-align:center;font-size:10px;color:var(--txt2);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.ltabs{display:flex;border:1.5px solid var(--borde);border-radius:8px;overflow:hidden;margin-bottom:18px}
.ltab{flex:1;padding:9px;background:none;border:none;font-size:12px;font-weight:700;cursor:pointer;color:var(--txt2);font-family:inherit}
.ltab.active{background:var(--az);color:#fff}
.social-btn{width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--borde);background:var(--white);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;color:var(--txt);transition:all 0.15s;font-family:inherit}
.social-btn:hover{background:var(--bg);border-color:var(--az3)}
.or-div{display:flex;align-items:center;gap:8px;margin:12px 0}
.or-line{flex:1;height:1px;background:var(--borde)}
.or-txt{font-size:11px;color:var(--txt2);font-weight:600}

/* ===== APK STEPS ===== */
.apk-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bg)}
.apk-step:last-child{border-bottom:none}
.apk-n{min-width:30px;height:30px;border-radius:50%;background:var(--az);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.apk-text{font-size:13px;color:var(--txt2);line-height:1.6}
.apk-text strong{color:var(--txt)}
.apk-text a{color:var(--az3);font-weight:600}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;right:24px;background:var(--az);border:2px solid var(--az3);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* ===== MODAL ===== */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:16px;padding:24px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:700;color:var(--az)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--txt2);padding:4px}

/* ===== MISC ===== */
.back-btn{background:none;border:none;color:var(--az3);font-size:13px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:4px;padding:0;font-weight:600}
.empty{text-align:center;padding:48px 24px;color:var(--txt2)}
.empty-icon{font-size:56px;margin-bottom:12px}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{padding:3px 10px;background:var(--ro-c);border-radius:20px;font-size:11px;color:#991b1b;border:1px solid #fca5a5;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:3px}
.chip i{font-size:9px}
.add-chip-row{display:flex;gap:6px;align-items:flex-end}
.section-sep{height:1px;background:var(--bg2);margin:16px 0}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:5px}
.cdot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s}
.cdot.sel{border-color:var(--txt);transform:scale(1.15)}
.tab-bar{display:flex;border-bottom:2px solid var(--bg2);margin-bottom:18px;gap:0}
.tab-btn{padding:10px 18px;background:none;border:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;font-family:inherit}
.tab-btn.active{color:var(--az);border-bottom-color:var(--ro)}
.info-banner{background:var(--az-c);border:1px solid #93c5fd;border-radius:8px;padding:10px 14px;font-size:12px;color:#1e40af;display:flex;align-items:flex-start;gap:8px;margin-top:8px}
.info-banner i{font-size:16px;flex-shrink:0;margin-top:1px}
@media(max-width:768px){
  .sidebar{width:64px}
  .sidebar.collapsed{width:64px}
  .sb-titles,.sb-stats,.sb-section{display:none}
  .main{margin-left:64px}
  .detail-layout{grid-template-columns:1fr}
  .f-row-2,.f-row-3,.f-row-4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>

  [{key:'padre',label:'Padre',color:'#eff6ff',border:'#93c5fd',roleColor:'#1e40af'},{key:'madre',label:'Madre',color:'#fdf2f8',border:'#f9a8d4',roleColor:'#9d174d'}],
  [{key:'abueloPat',label:'Abuelo paterno',color:'#f0fdf4',border:'#86efac',roleColor:'#166534'},{key:'abuelaMPat',label:'Abuela paterna',color:'#fdf4ff',border:'#e879f9',roleColor:'#7e22ce'},{key:'abueloMat',label:'Abuelo materno',color:'#fefce8',border:'#fde047',roleColor:'#854d0e'},{key:'abuelaMat',label:'Abuela materna',color:'#fff7ed',border:'#fed7aa',roleColor:'#9a3412'}],
  [{key:'bisbueloPP',label:'Bisabuelo P-P',color:'#f0fdf4',border:'#bbf7d0',roleColor:'#166534'},{key:'bisbuelaMP',label:'Bisabuela P-P',color:'#fdf4ff',border:'#f5d0fe',roleColor:'#7e22ce'},{key:'bisbueloPM',label:'Bisabuelo M-P',color:'#fefce8',border:'#fef08a',roleColor:'#854d0e'},{key:'bisbuelaMM',label:'Bisabuela M-M',color:'#fff7ed',border:'#fed7aa',roleColor:'#9a3412'}],
  [{key:'tatarabueloPP',label:'Tatarabuelo P-P',color:'#f8faff',border:'#bfdbfe',roleColor:'#1e40af'},{key:'tatarabuelaMPP',label:'Tatarabuela P-P',color:'#fdf4ff',border:'#f0abfc',roleColor:'#7e22ce'},{key:'tatarabuelo3',label:'Tatarabuelo P-M',color:'#f0fdf4',border:'#a7f3d0',roleColor:'#065f46'},{key:'tatarabuela4',label:'Tatarabuela M-M',color:'#fffbeb',border:'#fde68a',roleColor:'#92400e'}],
];

function LS(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function LSS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

let CFG=LS('cp_cfg',{titulo:'Castadero Pachón',subtitulo:'El Escorpión',logo:''});
let AUTH=LS('cp_auth',null);
let GALLOS=LS('cp_gallos',[]);
let COMBATES=LS('cp_combates',[]);
let RAZAS_EXTRA=LS('cp_razas',[]);
let VIEW='lista';

let SIDEBAR_OPEN=true;
let FORM={};
let EDIT_MODE=false;
let COMBATE_FORM={};
let COMBATE_EDIT_ID=null;
let SEL_COMBATE_ID=null;
let CAL_MES=new Date().getMonth();
let CAL_ANIO=new Date().getFullYear();
let PED_LEVELS=2; // cuántos niveles de genealogía activos

function saveAll(){LSS('cp_gallos',GALLOS);LSS('cp_combates',COMBATES);LSS('cp_razas',RAZAS_EXTRA);LSS('cp_cfg',CFG);LSS('cp_auth',AUTH)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function lunaIdx(ds){if(!ds)return -1;const d=new Date(ds+'T12:00:00');const days=(d.getTime()/86400000-10)%29.53;return Math.abs(Math.floor((days/29.53)*8)%8)}
function lunaForDate(ds){const i=lunaIdx(ds);return i>=0?LUNAS[i]:{e:'',l:''}}
function allRazas(){return[...RAZAS_DEF,...RAZAS_EXTRA]}

function render(){
  const root=document.getElementById('root');

  const content=renderContent();

  <div class="layout">
    <aside class="sidebar ${SIDEBAR_OPEN?'':'collapsed'}" id="sidebar">
      ${renderSidebar()}
    </aside>
    <div class="main ${SIDEBAR_OPEN?'':'expanded'}">
      ${renderTopbar()}

    </div>

  postRender();
}

}

function renderTopbar(){

function renderContent(){
  if(VIEW==='lista')return renderLista();
  if(VIEW==='nuevo')return renderForm();
  if(VIEW==='detalle')return renderDetalle();
  if(VIEW==='combates')return renderCombates();
  if(VIEW==='det-combate')return renderDetalleCombate();
  if(VIEW==='calendario')return renderCal();
  if(VIEW==='config')return renderConfig();
  return '';
}

function renderLista(){
  const wins=COMBATES.filter(c=>c.resultado==='Victoria'||c.resultado==='Muerte del contrario').length;
  const stats=`<div class="stats-grid">
    <div class="stat-card"><div class="stat-n">${GALLOS.length}</div><div class="stat-l">Total gallos</div></div>
    <div class="stat-card"><div class="stat-n">${GALLOS.filter(g=>g.estado==='activo'||!g.estado).length}</div><div class="stat-l">Activos</div></div>
    <div class="stat-card"><div class="stat-n">${[...new Set(GALLOS.map(g=>g.raza).filter(Boolean))].length}</div><div class="stat-l">Razas</div></div>
    <div class="stat-card"><div class="stat-n">${COMBATES.length}</div><div class="stat-l">Combates</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#166534">${wins}</div><div class="stat-l">Victorias</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#b91c1c">${COMBATES.length-wins}</div><div class="stat-l">Derrotas</div></div>
  </div>`;
  if(!GALLOS.length)return stats+`<div class="empty"><div class="empty-icon">🐓</div>
    <p style="font-size:16px;font-weight:700;color:#0d2d6e;margin-bottom:8px">Sin gallos registrados</p>
    <p style="margin-bottom:20px">Comienza registrando tu primer gallo en el castadero</p>
    <button class="btn btn-p" onclick="goTo('nuevo')"><i class="ti ti-plus" aria-hidden="true"></i> Registrar primer gallo</button></div>`;
  return stats+`<div class="gallo-grid">${GALLOS.map(g=>{
    const li=lunaIdx(g.fechaNac);const luna=li>=0?LUNAS[li].e:'';
    const bc=BC[g.estado||'activo']||'b-act';const bl=EL[g.estado||'activo']||g.estado||'Activo';
    const pesoStr=g.pesoLb&&g.pesoOz?`${g.pesoLb}lb ${g.pesoOz}oz`:g.pesoLb?`${g.pesoLb}lb`:'';
    return`<div class="gallo-card" onclick="verDetalle('${g.id}')">
      <div class="gallo-photo">${g.foto?`<img src="${g.foto}" alt="${g.nombre}"/>`:'🐓'}
        <div class="gallo-photo-badge"><span class="badge ${bc}">${bl}</span></div>
      </div>
      <div class="gallo-body">
        <div class="gallo-name">${g.nombre}</div>
        <div class="gallo-placa"><i class="ti ti-tag" style="font-size:11px" aria-hidden="true"></i> ${g.placa||'Sin placa'}</div>
        <div class="gallo-tags">
          ${g.raza?`<span class="tag t-az">${g.raza}</span>`:''}
          ${pesoStr?`<span class="tag t-gr">${pesoStr}</span>`:''}
          ${luna?`<span class="tag t-lu">${luna} ${LUNAS[li].l}</span>`:''}
          ${(g.marcas||[]).slice(0,1).map(m=>`<span class="tag t-ro">${m}</span>`).join('')}
          ${(g.topas||[]).length?`<span class="tag t-am">${g.topas.length} topa${g.topas.length>1?'s':''}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderPedLevels(g,levels){
  let html='';
  for(let lv=0;lv<Math.min(levels,PED_ROLES.length);lv++){
    const levelNames=['Padres','Abuelos','Bisabuelos','Tatarabuelos'];
    html+=`<div class="ped-level" id="pedLevel${lv}">
      <div class="ped-level-title">${levelNames[lv]||`Generación ${lv+1}`}
        ${lv>0?`<button class="remove-level-btn" onclick="removePedLevel(${lv})"><i class="ti ti-x" aria-hidden="true"></i> Quitar</button>`:''}
      </div>
      <div class="ped-grid">`;
    const roles=PED_ROLES[lv]||[];
    roles.forEach(r=>{
      const val=g[r.key]||{};
      html+=`<div class="ped-node" style="background:${r.color};border-color:${r.border}">
        <div class="ped-role" style="color:${r.roleColor}">${r.label}</div>
        <input placeholder="Nombre" id="ped-${r.key}-n" value="${val.nombre||''}" oninput="pedUpdate('${r.key}','nombre',this.value)"/>
        <input placeholder="Línea / Raza" id="ped-${r.key}-l" value="${val.linea||''}" style="margin-top:3px" oninput="pedUpdate('${r.key}','linea',this.value)"/>
      </div>`;
    });
    html+='</div></div>';
  }
  return html;
}

function renderPedDetalle(g){
  let html='';let hasAny=false;
  PED_ROLES.forEach((lvl,lv)=>{

    const nodes=lvl.filter(r=>g[r.key]&&g[r.key].nombre);
    if(!nodes.length)return;hasAny=true;
    html+=`<div style="margin-bottom:10px"><div class="ped-level-title" style="font-size:10px;font-weight:700;color:#475569;letter-spacing:1px;text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid #e2e8f0;margin-bottom:8px">${levelNames[lv]||'Generación '+(lv+1)}</div>
    <div class="ped-grid">`;
    nodes.forEach(r=>{const v=g[r.key]||{};html+=`<div class="ped-node" style="background:${r.color};border-color:${r.border}">
      <div class="ped-role" style="color:${r.roleColor}">${r.label}</div>
      <div class="ped-name" style="font-size:13px;font-weight:700;color:#0f172a">${v.nombre}</div>
      ${v.linea?`<div class="ped-sub" style="font-size:11px;color:#64748b">${v.linea}</div>`:''}</div>`});
    html+='</div></div>';
  });
  if(!hasAny)return'';
  return`<div class="card"><div class="card-title"><i class="ti ti-sitemap" aria-hidden="true"></i> Pedigree / Genealogía</div>${html}</div>`;
}

// ===== CALENDARIO =====
function renderCal(){
  const year=CAL_ANIO,month=CAL_MES;
  const firstDay=new Date(year,month,1).getDay();
  const dim=new Date(year,month+1,0).getDate();
  const today=new Date();
  const byDate={};
  GALLOS.forEach(g=>{if(!g.fechaNac)return;const d=new Date(g.fechaNac+'T12:00:00');if(d.getFullYear()===year&&d.getMonth()===month){const k=d.getDate();if(!byDate[k])byDate[k]=[];byDate[k].push({type:'gallo',data:g})}});
  COMBATES.forEach(c=>{if(!c.fecha)return;const d=new Date(c.fecha+'T12:00:00');if(d.getFullYear()===year&&d.getMonth()===month){const k=d.getDate();if(!byDate[k])byDate[k]=[];byDate[k].push({type:'combate',data:c})}});
  let cells='';
  for(let i=0;i<firstDay;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const items=byDate[d]||[];const hasG=items.some(x=>x.type==='gallo');const hasC=items.some(x=>x.type==='combate');
    const isToday=today.getDate()===d&&today.getMonth()===month&&today.getFullYear()===year;
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const li=lunaIdx(ds);const le=li>=0?LUNAS[li].e:'';
    const cls=isToday?'today':hasC?'hc':hasG?'hg':'';
    cells+=`<div class="cal-day ${cls}" ${items.length?`onclick="dayDet(${d})"`:''}>
      <span>${d}</span><span class="cal-ldot">${le}</span></div>`;
  }
  const prox=GALLOS.filter(g=>g.fechaNac).map(g=>{const d=new Date(g.fechaNac+'T12:00:00');const next=new Date(today.getFullYear(),d.getMonth(),d.getDate());if(next<today)next.setFullYear(today.getFullYear()+1);return{...g,dias:Math.round((next-today)/86400000)}}).filter(g=>g.dias<=90).sort((a,b)=>a.dias-b.dias).slice(0,5);
  return`
  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start">
    <div>
      <div class="card">
        <div class="cal-nav">
          <button class="btn btn-o btn-sm" onclick="camMes(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
          <div class="cal-title">${MESES[month]} ${year}</div>
          <button class="btn btn-o btn-sm" onclick="camMes(1)"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        </div>
        <div class="cal-grid">${DIAS.map(d=>`<div class="cal-dn">${d}</div>`).join('')}${cells}</div>
        <div style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap">
          <span style="font-size:11px;color:#1e40af;font-weight:600;display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;background:#dbeafe;border:1px solid #93c5fd;border-radius:2px;display:inline-block"></span> Cumpleaños gallo</span>
          <span style="font-size:11px;color:#991b1b;font-weight:600;display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;background:#fee2e2;border:1px solid #fca5a5;border-radius:2px;display:inline-block"></span> Fecha de combate</span>
          <span style="font-size:11px;color:#475569">Las fases lunares se muestran en cada día</span>
        </div>
      </div>
    </div>
    <div>
      ${prox.length?`<div class="card"><div class="card-title"><i class="ti ti-cake" aria-hidden="true"></i> Próximos cumpleaños</div>

function recogerTopas(){
  const topas=[];let i=0;
  while(document.getElementById(`topa-${i}-fecha`)!==null){
    const fechaEl=document.getElementById(`topa-${i}-fecha`);
    const l=fechaEl&&fechaEl.value?lunaForDate(fechaEl.value):{e:'',l:''};
    topas.push({
      fecha:fechaEl?fechaEl.value:'',
      numero:parseInt(document.getElementById(`topa-${i}-num`).value)||i+1,
      duracion:document.getElementById(`topa-${i}-dur`).value||'',
      videoUrl:document.getElementById(`topa-${i}-video`).value||'',
      observaciones:document.getElementById(`topa-${i}-obs`).value||'',
      lunaFase:l.l,lunaEmoji:l.e,
    });i++;
  }
  return topas;
}
function recogerPed(levels){
  const ped={};
  for(let lv=0;lv<levels&&lv<PED_ROLES.length;lv++){
    PED_ROLES[lv].forEach(r=>{
      const nEl=document.getElementById(`ped-${r.key}-n`);
      const lEl=document.getElementById(`ped-${r.key}-l`);
      if(nEl||lEl)ped[r.key]={nombre:(nEl?nEl.value:''),linea:(lEl?lEl.value:'')};
    });
  }
  return ped;
}

function dayDet(day){
  const year=CAL_ANIO,month=CAL_MES;
  const gallos=GALLOS.filter(g=>{if(!g.fechaNac)return false;const d=new Date(g.fechaNac+'T12:00:00');return d.getFullYear()===year&&d.getMonth()===month&&d.getDate()===day});
  const combates=COMBATES.filter(c=>{if(!c.fecha)return false;const d=new Date(c.fecha+'T12:00:00');return d.getFullYear()===year&&d.getMonth()===month&&d.getDate()===day});
  const el=document.getElementById('dayDetDiv');if(!el)return;
  let html='';
  if(gallos.length)html+=`<div class="card" style="border-color:#2563eb"><div class="card-title"><i class="ti ti-cake" aria-hidden="true"></i> Nacidos el día ${day}</div>${gallos.map(g=>`<div class="irow" onclick="verDetalle('${g.id}')" style="cursor:pointer"><span class="ilbl"><i class="ti ti-feather" aria-hidden="true"></i> ${g.nombre}</span><span class="ival" style="color:#2563eb">Ver →</span></div>`).join('')}</div>`;
  if(combates.length)html+=`<div class="card" style="border-color:#b91c1c"><div class="card-title"><i class="ti ti-swords" aria-hidden="true"></i> Combates del día ${day}</div>${combates.map(c=>{const g=GALLOS.find(x=>x.id===c.galloId);const rc=RC[c.resultado]||'b-draw';return`<div class="irow" onclick="verCombate('${c.id}')" style="cursor:pointer"><span class="ilbl">${g?g.nombre:'?'}</span><span class="ival"><span class="badge ${rc}">${c.resultado||'—'}</span></span></div>`}).join('')}</div>`;
  el.innerHTML=html;
}
function exportJSON(){
  const data=JSON.stringify({app:CFG.titulo,v:3,cfg:CFG,fecha:new Date().toISOString(),gallos:GALLOS,combates:COMBATES,razasExtra:RAZAS_EXTRA},null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=`${CFG.titulo.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Backup descargado');
}
function exportTxt(){
  const lines=GALLOS.map(g=>`=== ${g.nombre.toUpperCase()} ===\nPlaca: ${g.placa||'N/A'}\nRaza: ${g.raza||'N/A'}\nPeso: ${g.pesoLb||'0'}lb ${g.pesoOz||'0'}oz\nNac: ${g.fechaNac||'N/A'}\nLuna: ${g.lunaEmoji||''} ${g.lunaFase||'N/A'}\nEstado: ${EL[g.estado||'activo']}\nTopas: ${(g.topas||[]).length}\n`).join('\n');
  const clines=COMBATES.map(c=>{const g=GALLOS.find(x=>x.id===c.galloId);return`⚔️ ${g?g.nombre:'?'} vs ${c.rival||'?'} | ${c.fecha||'?'} | ${c.resultado||'?'} | Espuela: ${c.espuela||'N/A'}`}).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`${CFG.titulo} — ${CFG.subtitulo}\n${new Date().toLocaleDateString('es-CO')}\n\n=== GALLOS ===\n${lines}\n=== COMBATES ===\n${clines}`],{type:'text/plain'}));
  a.download=`castadero_${new Date().toISOString().slice(0,10)}.txt`;a.click();toast('Texto exportado');
}
function exportHTML(){
  const html=document.documentElement.outerHTML;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download='castadero_pachon_app.html';a.click();toast('HTML descargado');
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const gallos=data.gallos||data;
      if(!Array.isArray(gallos))throw new Error('Formato inválido');
      if(!confirm(`¿Restaurar ${gallos.length} gallos y ${(data.combates||[]).length} combates?`))return;
      GALLOS=gallos;COMBATES=data.combates||[];RAZAS_EXTRA=data.razasExtra||[];
      if(data.cfg)CFG={...CFG,...data.cfg};
      saveAll();toast('Datos restaurados');goTo('lista');
    }catch(err){alert('Archivo inválido: '+err.message)}
  };r.readAsText(f);
}
function borrarTodo(){if(!confirm('⚠️ ¿Borrar TODOS los datos? Esta acción no se puede deshacer.'))return;GALLOS=[];COMBATES=[];saveAll();toast('Datos eliminados');goTo('lista')}
function backupDrive(){
  exportJSON();
  setTimeout(()=>toast('Archivo listo — súbelo manualmente a drive.google.com'),600);
}

function postRender(){
  // Make all elements globally accessible for inline onclick handlers
  window.addMarca=addMarca;window.rmMarca=rmMarca;window.trigCam=trigCam;window.trigGal=trigGal;
  window.handlePhoto=handlePhoto;window.guardar=guardar;window.guardarCombate=guardarCombate;
  window.selLuna=selLuna;window.autoLuna=autoLuna;window.selColor=selColor;
  window.addPedLevel=addPedLevel;window.removePedLevel=removePedLevel;window.pedUpdate=pedUpdate;
  window.addTopa=addTopa;window.removeTopa=removeTopa;
  window.addRazaExtra=addRazaExtra;window.switchTab=switchTab;
  window.verDetalle=verDetalle;window.verCombate=verCombate;
  window.editarGallo=editarGallo;window.eliminar=eliminar;window.elimCombate=elimCombate;
  window.abrirCombateModal=abrirCombateModal;window.editCombateModal=editCombateModal;
  window.cerrarModal=cerrarModal;window.guardarConfig=guardarConfig;
  window.handleLogoUpload=handleLogoUpload;window.camMes=camMes;window.dayDet=dayDet;
  window.exportJSON=exportJSON;window.exportTxt=exportTxt;window.exportHTML=exportHTML;
  window.importJSON=importJSON;window.borrarTodo=borrarTodo;window.backupDrive=backupDrive;
  window.cerrarSesion=cerrarSesion;window.setLT=setLT;window.doLogin=doLogin;
  window.socialLogin=socialLogin;window.toggleSidebar=toggleSidebar;window.goTo=goTo;
}

render();
</script>
</body>
